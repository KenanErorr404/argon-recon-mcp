[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argon-recon-mcp"
version = "1.0.1"
description = "Localhost Model Context Protocol (MCP) server for passive domain & CVE/KEV reconnaissance."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "httpx>=0.27.0"
]

[project.scripts]
argon-recon-mcp = "argon_recon_mcp.server:main"
