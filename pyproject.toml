[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "argon-recon-mcp"
version = "2.0.0"
description = "100% standalone Model Context Protocol (MCP) server for passive Attack Surface & Live CISA KEV / CVE Reconnaissance."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["mcp", "security", "reconnaissance", "cve", "cisa-kev", "ghsa", "attack-surface"]
dependencies = [
  "httpx>=0.27.0"
]

[project.urls]
Homepage = "https://github.com/KenanErorr404/argon-recon-mcp"
Sponsor = "https://www.buymeacoffee.com/kenanerorr404"

[project.scripts]
argon-recon-mcp = "argon_recon_mcp.server:main"
